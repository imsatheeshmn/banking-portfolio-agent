# Ruff configuration for banking-portfolio-agent
target-version = "py312"
line-length = 100

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C4",  # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = [
    "E501", # Line length (handled by ruff format)
    "B008", # Do not perform function call in argument defaults (standard for FastAPI Depends/Query)
]

[lint.isort]
known-first-party = ["app"]
